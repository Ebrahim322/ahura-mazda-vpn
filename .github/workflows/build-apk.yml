# Builds an installable APK in the cloud, so the app can be produced without
# any local Android toolchain: push (or run the workflow by hand) and download
# the artifact — or tag a release and grab the APK from the Releases page.
name: Build APK

on:
  push:
    branches: ["main", "arena/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: assemble APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate the Gradle wrapper (for local builds)
        working-directory: android
        run: gradle --no-daemon wrapper --gradle-version 8.9

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Show what came out
        working-directory: android
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahura-mazda-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach the APK to a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          body: |
            ## نصب / Install

            فایل `app-debug.apk` را دانلود و روی گوشی اندروید نصب کنید
            (اجازهٔ «نصب از منابع ناشناس» لازم است).

            1. سرور رله را با یک دستور نصب کنید (روی VPS):
               `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/server/install.sh | sudo bash`
            2. لینک `ahura://…` چاپ‌شده را در پیام‌رسان برای خودتان بفرستید و
               در اپ با دکمهٔ «افزودن از کلیپ‌بورد» وارد کنید.
            3. دکمهٔ اتصال را بزنید.
